name: Build Plugin
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download libs
        run: |
          mkdir -p libs
          curl -L -o libs/spigot-api.jar "https://spigotmc.org"
          curl -L -o libs/worldguard.jar "https://bukkit.org"
          curl -L -o libs/worldedit.jar "https://bukkit.org"
      - run: mvn package
      - uses: actions/upload-artifact@v4
        with:
          name: CreeperWitherFix
          path: target/CreeperWitherFix-1.0.jar
